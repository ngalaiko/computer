name: deploy

on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    name: Activate in place
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - uses: nixbuild/nix-quick-install-action@v35
      # The box is reachable only over its tailnet. This tailnet OAuth client is
      # the only credential the in-place path needs — NOT an app secret. The client
      # id is public (inline); only the secret is a repo secret. The policy must let
      # tag:ci tailscale-ssh nikita@ the exedev node (README):
      #   "ssh": [{ "action": "accept", "src": ["tag:ci"],
      #             "dst": ["tag:exedev"], "users": ["nikita"] }]
      - name: Join tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: kt74FE1o8p11CNTRL
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # DEPLOY_FLAKE pins the workflow commit; nixos-rebuild evaluates here and
      # builds in the box's store as the trusted nikita user.
      - name: Diagnose Tailscale connectivity
        run: |
          tailscale status
          tailscale ping exedev || true
          getent ahostsv4 exedev || true
          nc -vz -w10 exedev 22 || true
          # Tailscale SSH needs a working target /etc/passwd; retain its result
          # as diagnostics only, so a broken rootfs can still be repaired via
          # the platform's OpenSSH server below.
          tailscale ssh nikita@exedev true || true

      - name: Activate in place
        env:
          DEPLOY_FLAKE: github:ngalaiko/computer/${{ github.sha }}
        run: nix run .#deploy
