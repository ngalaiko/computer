theme = "zenwritten"
vcs = "jj"
mode = "unified"
agent_notes = true
watch = true
menu_bar = false
prompt_save_view_preferences = false

[extensions]
paths = ["~/.config/hunk/extensions/pi-review"]

[keybindings]
"hunk.review.previousFile" = []

[themes.zenwritten]
base = "min-dark"
label = "Zenwritten"
background = "#191919"
panel = "#222222"
panelAlt = "#222222"
border = "#404040"
accent = "#6099C0"
accentMuted = "#686868"
text = "#BBBBBB"
muted = "#686868"
addedBg = "#232D1A"
removedBg = "#3E2225"
movedAddedBg = "#1D2C36"
movedRemovedBg = "#1D2C36"
contextBg = "#191919"
addedContentBg = "#232D1A"
removedContentBg = "#3E2225"
contextContentBg = "#191919"
addedSignColor = "#819B69"
removedSignColor = "#DE6E7C"
lineNumberBg = "#191919"
lineNumberFg = "#616161"
selectedHunk = "#404040"
badgeAdded = "#819B69"
badgeRemoved = "#DE6E7C"
badgeNeutral = "#686868"
fileNew = "#819B69"
fileDeleted = "#DE6E7C"
fileRenamed = "#B77E64"
fileModified = "#6099C0"
fileUntracked = "#B279A7"
noteBorder = "#66A5AD"
noteBackground = "#222222"
noteTitleBackground = "#404040"
noteTitleText = "#BBBBBB"

